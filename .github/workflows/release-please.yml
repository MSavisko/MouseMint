name: Release PR
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-management
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      commit: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
      - name: Check for an unpublished release
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pending="$(gh api --paginate --slurp "repos/$GH_REPO/releases" | jq 'any(.[][]; .draft)')"
          printf 'exists=%s\n' "$pending" >> "$GITHUB_OUTPUT"
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: proposal
        if: steps.release.outputs.release_created != 'true' && steps.pending.outputs.exists == 'false'
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
      # Bot-created pull_request runs require a writer's approval.
      # Dispatch CI immediately too, without a long-lived PAT.
      - name: Check the generated release PR
        if: steps.proposal.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PRS: ${{ steps.proposal.outputs.prs }}
        run: |
          while IFS= read -r branch; do
            gh workflow run ci.yml --ref "$branch"
          done < <(printf '%s' "$RELEASE_PRS" | jq -r '.[].headBranchName')
  publish:
    needs: release
    if: needs.release.outputs.created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      commit: ${{ needs.release.outputs.commit }}
    secrets: inherit
