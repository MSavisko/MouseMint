min_version = "2026.6.10"

[tools]
"aqua:tuist/tuist" = "4.211.0"
"aqua:rhysd/actionlint" = "1.7.12"
python = "3.13.7"

[settings]
experimental = true
lockfile = true

[tasks.generate]
description = "Generate the Xcode workspace"
run = "./generate.sh"

[tasks.build]
description = "Build the release app in dist/MouseMint.app"
run = "./build.sh"

[tasks.test]
description = "Run all native tests"
run = "./test.sh"

[tasks.release-check]
description = "Check release scripts and GitHub workflows"
run = ["python3 -m unittest discover -s Tests/Release -v", "actionlint -shellcheck= -pyflakes="]
